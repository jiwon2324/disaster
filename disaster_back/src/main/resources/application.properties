spring.application.name=disaster_back

server.port=80

# =========================
# MariaDB
# =========================
spring.datasource.driverClassName=org.mariadb.jdbc.Driver

# 학교에서는 DBA 컴퓨터의 DB 사용
spring.datasource.url=jdbc:mariadb://10.15.21.211:3306/disaster
spring.datasource.username=disaster
spring.datasource.password=disaster

# 집에서 자기 컴퓨터 DB를 사용할 경우 위 주소를 주석 처리하고 사용
# spring.datasource.url=jdbc:mariadb://localhost:3306/disaster

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT
# =========================
springboot.jwt.secret=around-hub-studio-flature-spring-boot-3!@#

# =========================
# 파일 업로드
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=c:/Temp

# =========================
# Gmail SMTP
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# IntelliJ 환경변수에서 입력
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend-url=http://localhost:5173